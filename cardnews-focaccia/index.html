<title>까치 카페 포카치아</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one 4:5 menu card (1080×1350). Cream paper, a red name plate on top, one focaccia piece on a pewter plate
   in the centre, English name in a classic serif with the Korean name underneath. */
:root {
  --page-bg: #ece6dc;
  --page-fg: #2b2420;
  --page-muted: #6f655b;
  --paper: #f4ede1;
  --ink: #2a2420;
  --red: #a8262b;
  --serif: "Cormorant Garamond", "Times New Roman", serif;
  --sans: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #1a1714; --page-fg: #ece4d8; --page-muted: #a3988b; color-scheme: dark; }
}
:root[data-theme="dark"] { --page-bg: #1a1714; --page-fg: #ece4d8; --page-muted: #a3988b; color-scheme: dark; }

body { background: var(--page-bg); color: var(--page-fg); font-family: var(--sans); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 64px; }
.intro { display: grid; gap: 6px; margin-bottom: 28px; }
.intro h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
.intro p { margin: 0; color: var(--page-muted); font-size: .9rem; }

.card { container-type: inline-size; position: relative; overflow: hidden; aspect-ratio: 4 / 5; width: 100%; max-width: 100%;
  background: var(--paper); color: var(--ink); border-radius: 6px; font-family: var(--sans); }
.card.export { border-radius: 0; width: 1080px; max-width: none; }

.plate-name { position: absolute; left: 50%; top: 11cqw; transform: translateX(-50%); white-space: nowrap;
  background: var(--red); color: #fff; font-family: var(--serif); font-weight: 600; font-size: 8.4cqw; line-height: 1;
  padding: 1.6cqw 4.4cqw 2.2cqw; letter-spacing: .01em; }

.dish { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 78cqw; height: 58cqw; }
.dish .shadow { position: absolute; left: 6%; right: 2%; top: 30%; bottom: -6%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 55%, rgba(60,40,25,.32), rgba(60,40,25,0) 70%); filter: blur(1.4cqw); }
.dish .plate { position: absolute; left: 0; right: 0; top: 24%; bottom: 0; border-radius: 50%;
  background: radial-gradient(ellipse at 42% 35%, #d9d6cf 0, #a9a49b 38%, #7b766d 72%, #5f5a52 100%);
  box-shadow: inset 0 -1.2cqw 2cqw rgba(0,0,0,.25), inset 0 .8cqw 1.4cqw rgba(255,255,255,.35); }
.dish .plate::after { content: ""; position: absolute; inset: 9% 7%; border-radius: 50%;
  background: radial-gradient(ellipse at 45% 40%, #cfcbc3 0, #9f9a90 55%, #827d74 100%);
  box-shadow: inset 0 .6cqw 1.2cqw rgba(0,0,0,.28); }
.dish .piece { position: absolute; left: 50%; top: 52%; width: 54cqw; transform: translate(-50%, -50%);
  filter: drop-shadow(0 1.6cqw 1.4cqw rgba(40,28,18,.35)); }

.name { position: absolute; left: 0; right: 0; bottom: 15cqw; text-align: center; }
.name .en { font-family: var(--serif); font-weight: 500; font-size: 7.2cqw; line-height: 1.1; }
.name .ko { margin-top: 1.4cqw; font-size: 3.3cqw; font-weight: 500; letter-spacing: .04em; }
.cafe { position: absolute; left: 0; right: 0; bottom: 6.5cqw; text-align: center; font-size: 2.6cqw; font-weight: 600; letter-spacing: .3em; color: var(--red); }
</style>

<div class="wrap">
  <header class="intro">
    <h1>까치 카페 포카치아</h1>
    <p>어니언 토마토 포카치아 · 1080×1350 (4:5) 인스타그램 규격</p>
  </header>

  <div class="grid">
  <article class="card" data-n="01">
    <div class="plate-name">Focaccia</div>
    <div class="dish">
      <div class="shadow"></div>
      <div class="plate"></div>
      <img class="piece" src="img/piece.png" alt="접시 위에 놓인 어니언 토마토 포카치아 한 조각, 토마토와 올리브, 로즈마리가 올라가 있다">
    </div>
    <div class="name">
      <div class="en">Onion &amp; Tomato</div>
      <div class="ko">어니언 토마토 포카치아</div>
    </div>
    <div class="cafe">까치 카페</div>
  </article>
  </div>
</div>
