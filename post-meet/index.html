<title>잘 먹는 것만큼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&display=swap">
<style>
/* Layout: one 4:5 post (1080×1350). The breakfast photo fills the frame; the title sits over the dark wood at the top. */
:root {
  --page-bg: #ece6dc;
  --page-fg: #2b2420;
  --page-muted: #6f655b;
  --cream: #fff8ee;
  --sans: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #1a1714; --page-fg: #ece4d8; --page-muted: #a3988b; color-scheme: dark; }
}
:root[data-theme="dark"] { --page-bg: #1a1714; --page-fg: #ece4d8; --page-muted: #a3988b; color-scheme: dark; }
body { background: var(--page-bg); color: var(--page-fg); font-family: var(--sans); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 64px; }
.intro { display: grid; gap: 6px; margin-bottom: 28px; }
.intro h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
.intro p { margin: 0; color: var(--page-muted); font-size: .9rem; }

.card { container-type: inline-size; position: relative; overflow: hidden; aspect-ratio: 4 / 5; width: 100%; max-width: 100%;
  background: #3a2618; color: var(--cream); border-radius: 6px; font-family: var(--sans); }
.card.export { border-radius: 0; width: 1080px; max-width: none; }
.ph { position: absolute; inset: 0; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 70%; }
.ph::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(40,24,14,.72) 0, rgba(40,24,14,.45) 18%, rgba(40,24,14,0) 36%); }
.title { position: absolute; left: 8cqw; right: 8cqw; top: 8.5cqw; z-index: 2; margin: 0;
  font-weight: 700; font-size: 8cqw; line-height: 1.3; letter-spacing: -.035em; word-break: keep-all;
  text-shadow: 0 .3cqw 1.8cqw rgba(0,0,0,.45); }
</style>

<div class="wrap">
  <header class="intro">
    <h1>잘 먹는 것만큼</h1>
    <p>게시물 이미지 · 1080×1350 (4:5) 인스타그램 규격</p>
  </header>
  <div class="grid">
    <article class="card" data-n="01">
      <div class="ph"><img src="img/plate.jpg" alt="나무 테이블 위 타원 접시에 사과, 당근 라페, 아보카도, 포카치아가 담긴 아침 식사"></div>
      <h2 class="title">“잘 먹는 것만큼,<br>잘 만나고 싶다.”</h2>
    </article>
  </div>
</div>
